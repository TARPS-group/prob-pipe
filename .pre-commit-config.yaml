# Pre-commit hooks for ProbPipe. Install them once as CONTRIBUTING.md
# ("Linting & pre-commit") describes; thereafter they run on staged files at
# commit time.
#
# Hooks only see the files you're changing, so a commit is checked without
# re-running over the whole tree. `ruff` here flags but
# does NOT auto-fix (no `--fix`) — fixes stay intentional and reviewable. The
# `ruff-format` hook DOES rewrite files (that is its job); notebooks are excluded
# from formatting via `[tool.ruff.format]` in pyproject.toml.
#
# This ruff rev is the single source of truth for the version: the CI lint job
# reads it from here, and `pre-commit autoupdate` bumps it. Keep uv.lock's ruff
# in sync too, so local `uv run ruff` matches.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--output-format=full"]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.ipynb$'   # notebook JSON manages its own whitespace
      - id: end-of-file-fixer
        exclude: '\.ipynb$'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]   # allow uv.lock (~760 KB); still catch stray data/binaries

  # pydoclint checks that a docstring with a section documents each parameter
  # and the return value (STYLE_GUIDE.md §3.3). It runs as a flake8 plugin, and
  # `--select=DOC` reports its codes alone. The plugin lets the hook ignore
  # DOC105, which compares a docstring's types with the annotations, because a
  # docstring states its types in words, such as "array-like". DOC202 flags a
  # Returns section in a function without a return statement, and an
  # operation's declaration in probpipe/operations/ has no body, since its
  # routes compute what its Returns section describes. The CI lint job runs
  # this hook over the whole tree, so its options here are the only copy.
  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        alias: pydoclint
        name: pydoclint (docstrings)
        additional_dependencies: ["pydoclint==0.11.0"]
        files: ^probpipe/.*\.py$
        args:
          - --select=DOC
          - --extend-ignore=DOC105
          - --per-file-ignores=probpipe/operations/*.py:DOC202
          - --style=numpy
          - --skip-checking-raises=True
          - --check-return-types=False
          - --check-yield-types=False
          - --check-class-attributes=False

  # CONTRACTS.md directive 2 bans PR and issue references in code: a word form
  # such as "issue 12" or "PR #12", a bare "#12", or a GitHub issue or pull URL.
  - repo: local
    hooks:
      - id: no-issue-numbers
        name: no issue or PR numbers in probpipe/
        language: pygrep
        entry: '(?i)(?<![\w/-])(?:issues?|prs?|pull requests?)\s+#?\d+\b|(?<![&\w/])#\d+\b|github\.com/[\w.-]+/[\w.-]+/(?:issues|pull)/\d+'
        files: ^probpipe/.*\.py$
