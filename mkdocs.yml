site_name: ProbPipe
site_description: Probabilistic pipelines with automated uncertainty quantification
site_url: https://tarps-group.github.io/prob-pipe
repo_url: https://github.com/TARPS-group/prob-pipe
repo_name: TARPS-group/prob-pipe

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

hooks:
  - mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            # Render every ``:::`` directive's root heading at h3 by default.
            # This puts symbol headings one level below manual ``##`` section
            # headings, so the right-rail TOC indents symbols under their
            # section header. Class members are then h4, hidden by toc_depth.
            heading_level: 3
  - mkdocs-jupyter:
      ignore_h1_titles: true
      execute: false


markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      # Right-rail TOC shows h1, h2 (sections) and h3 (mkdocstrings symbol
      # root headings). Class methods/properties are rendered at h4 by
      # mkdocstrings and are excluded by this depth limit.
      toc_depth: 3

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Get started:
    - Installation: get_started/installation.md
    - Quickstart: get_started/quickstart.ipynb
  - Tutorials:
    - "1. A model of the moose counts": tutorials/01_first_analysis.ipynb
    - "2. Fitting and checking the model": tutorials/02_fitting.ipynb
    - "3. Revising and cross-checking the model": tutorials/03_revising.ipynb
    - "4. Forecasting with uncertainty": tutorials/04_forecasting.ipynb
    - "5. Updating forecasts as counts arrive": tutorials/05_updating.ipynb
    - "6. Fitting a model that can only be simulated": tutorials/06_simulating.ipynb
  - User guide:
    - user_guide/index.md
    - Terms: user_guide/01_terms.ipynb
    - Values and records: user_guide/02_values_and_records.ipynb
    - Distributions: user_guide/03_distributions.ipynb
    - Joint models and conditional distributions: user_guide/04_joint_models.ipynb
    - Functions on values and distributions: user_guide/05_functions_and_lifting.ipynb
    - Conditioning and inference methods: user_guide/06_conditioning_and_inference.ipynb
    - Checking results: user_guide/07_checking_results.ipynb
    - Converting and updating distributions: user_guide/08_conversion_and_updating.ipynb
    - How a result was computed: user_guide/09_how_results_are_computed.ipynb
    - Ray via Prefect: user_guide/ray.md
  - API reference:
    - api/index.md
    - Values and records: api/values.md
    - Declarations: api/declarations.md
    - Distributions and families: api/distributions.md
    - Random functions: api/random_functions.md
    - Functions: api/functions.md
    - Operations: api/operations.md
    - Inference methods: api/inference.md
    - Conversion: api/conversion.md
    - Workflows and reproducibility: api/workflows.md
    - Labels and provenance: api/provenance.md
    - Diagnostics: api/diagnostics.md
    - Validation: api/validation.md
    - Registries for extensions: api/extending.md
  - Cite: cite.md
  - Help: help.md
