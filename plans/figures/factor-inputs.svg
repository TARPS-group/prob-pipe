<svg xmlns="http://www.w3.org/2000/svg" width="332" height="162" viewBox="0 0 332 162" role="img">
  <title>The law a &amp; c, whose factor a still takes the optional input sigma</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#424a53"/>
    </marker>
    <marker id="arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="331" height="161" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g transform="translate(60.4,18.0)">
    <rect x="0.0" y="0.0" width="210.9" height="80.0" rx="8" fill="#f6f0ff" stroke="#8250df" stroke-width="1.6"/>
    <rect x="10.0" y="7.0" width="31.6" height="17.0" rx="8.5" fill="#8250df" stroke="#8250df" stroke-width="1"/>
    <text x="25.8" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">law</text>
    <text x="49.6" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">a &amp; c</text>
    <text x="12.0" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">y</text>
    <text x="12.0" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">mu</text>
    <text x="198.9" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#59636e" text-anchor="end" font-style="italic">sigma</text>
    <text x="93.5" y="56.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" font-style="italic">factors: a, c</text>
    <circle cx="0.0" cy="41.0" r="4.5" fill="#8250df" stroke="#8250df" stroke-width="1.6"/>
    <circle cx="0.0" cy="63.0" r="4.5" fill="#8250df" stroke="#8250df" stroke-width="1.6"/>
    <circle cx="210.9" cy="41.0" r="5.3" fill="#ffffff" stroke="#8250df" stroke-width="1.6" stroke-dasharray="2.2 1.8"/>
    <text x="105.4" y="104.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">no inputs; one factor input, sigma (dashed),</text>
    <text x="105.4" y="122.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">left at its default 1</text>
