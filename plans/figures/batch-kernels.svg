<svg xmlns="http://www.w3.org/2000/svg" width="579" height="232" viewBox="0 0 579 232" role="img">
  <title>A batch of kernels: its inputs, and no outputs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#424a53"/>
    </marker>
    <marker id="arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="578" height="231" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g transform="translate(18.0,28.0)">
    <rect x="71.7" y="0.0" width="112.0" height="80.0" rx="8" fill="#fff0f7" stroke="#bf3989" stroke-width="1.6"/>
    <rect x="81.7" y="7.0" width="49.3" height="17.0" rx="8.5" fill="#bf3989" stroke="#bf3989" stroke-width="1"/>
    <text x="106.3" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">kernel</text>
    <text x="139.0" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">k_j</text>
    <text x="83.7" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">y</text>
    <text x="83.7" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">w</text>
    <text x="171.7" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">mu</text>
    <circle cx="71.7" cy="41.0" r="4.5" fill="#bf3989" stroke="#bf3989" stroke-width="1.6"/>
    <circle cx="71.7" cy="63.0" r="4.5" fill="#bf3989" stroke="#bf3989" stroke-width="1.6"/>
    <circle cx="183.7" cy="41.0" r="4.5" fill="#bf3989" stroke="#bf3989" stroke-width="1.6"/>
    <text x="127.7" y="128.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">one element: k_j, a kernel over {y, w}</text>
    <text x="127.7" y="146.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">given mu; outputs y and w</text>
    <rect x="336.5" y="-10.0" width="206.0" height="102.0" rx="8" fill="#fff8d6" stroke="#9a6700" stroke-width="1.2"/>
    <rect x="331.5" y="-5.0" width="206.0" height="102.0" rx="8" fill="#fff8d6" stroke="#9a6700" stroke-width="1.2"/>
    <rect x="326.5" y="0.0" width="206.0" height="102.0" rx="8" fill="#fff8d6" stroke="#9a6700" stroke-width="1.6"/>
    <rect x="336.5" y="7.0" width="43.4" height="17.0" rx="8.5" fill="#9a6700" stroke="#9a6700" stroke-width="1"/>
    <text x="358.2" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">batch</text>
    <text x="387.9" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">ks</text>
    <text x="338.5" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#59636e" text-anchor="start">y</text>
    <text x="338.5" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#59636e" text-anchor="start">w</text>
    <text x="520.5" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">mu</text>
    <text x="425.6" y="45.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" font-style="italic">elements: kernels</text>
    <text x="425.6" y="67.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" font-style="italic">no outputs</text>
    <text x="338.5" y="92.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#59636e" text-anchor="start">levels: j</text>
    <circle cx="532.5" cy="41.0" r="4.5" fill="#9a6700" stroke="#9a6700" stroke-width="1.6"/>
    <text x="429.5" y="128.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">the batch: input mu, bound once</text>
    <text x="429.5" y="146.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">for every element; no outputs,</text>
    <text x="429.5" y="164.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">since its elements are kernels;</text>
    <text x="429.5" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">paths y and w</text>
