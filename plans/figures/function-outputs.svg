<svg xmlns="http://www.w3.org/2000/svg" width="432" height="164" viewBox="0 0 432 164" role="img">
  <title>A function into records and its selection at one output</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#424a53"/>
    </marker>
    <marker id="arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="431" height="163" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g transform="translate(18.0,18.0)">
    <rect x="7.8" y="0.0" width="112.0" height="80.0" rx="8" fill="#eefbf1" stroke="#1a7f37" stroke-width="1.6"/>
    <rect x="17.8" y="7.0" width="61.0" height="17.0" rx="8.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1"/>
    <text x="48.4" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">function</text>
    <text x="86.9" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">f</text>
    <text x="19.8" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">y</text>
    <text x="19.8" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">z</text>
    <text x="107.8" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">x</text>
    <circle cx="7.8" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <circle cx="7.8" cy="63.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <circle cx="119.8" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <text x="63.8" y="106.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">f maps x to {y, z}:</text>
    <text x="63.8" y="124.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">it offers y and z</text>
    <rect x="221.6" y="0.0" width="169.5" height="58.0" rx="8" fill="#eefbf1" stroke="#1a7f37" stroke-width="1.6"/>
    <rect x="231.6" y="7.0" width="61.0" height="17.0" rx="8.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1"/>
    <text x="262.1" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">function</text>
    <text x="300.7" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">f[y]</text>
    <text x="210.6" y="35.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="end">y</text>
    <text x="379.1" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">x</text>
    <text x="295.4" y="45.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" font-style="italic">returns an array</text>
    <circle cx="221.6" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <circle cx="391.1" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <text x="294.4" y="106.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">f[y] maps x to f(x)'s y;</text>
    <text x="294.4" y="124.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">the same input</text>
  </g>
</svg>
