<svg xmlns="http://www.w3.org/2000/svg" width="458" height="164" viewBox="0 0 458 164" role="img">
  <title>A function whose return value is a record, and its selection at one output</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#424a53"/>
    </marker>
    <marker id="arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="457" height="163" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g transform="translate(18.0,18.0)">
    <rect x="21.3" y="0.0" width="112.0" height="80.0" rx="8" fill="#eefbf1" stroke="#1a7f37" stroke-width="1.6"/>
    <rect x="31.3" y="7.0" width="61.0" height="17.0" rx="8.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1"/>
    <text x="61.8" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">function</text>
    <text x="100.3" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">f</text>
    <text x="33.3" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">y</text>
    <text x="33.3" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">z</text>
    <text x="121.3" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">x</text>
    <circle cx="21.3" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <circle cx="21.3" cy="63.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <circle cx="133.3" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <text x="77.3" y="106.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">f maps x to {y, z}:</text>
    <text x="77.3" y="124.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">its outputs are y and z</text>
    <rect x="248.5" y="0.0" width="169.5" height="58.0" rx="8" fill="#eefbf1" stroke="#1a7f37" stroke-width="1.6"/>
    <rect x="258.5" y="7.0" width="61.0" height="17.0" rx="8.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1"/>
    <text x="289.0" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">function</text>
    <text x="327.5" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">f[y]</text>
    <text x="237.5" y="35.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="end">y</text>
    <text x="405.9" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">x</text>
    <text x="322.2" y="45.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" font-style="italic">returns an array</text>
    <circle cx="248.5" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <circle cx="417.9" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <text x="321.2" y="106.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">f[y] maps x to f(x)'s y;</text>
    <text x="321.2" y="124.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">the same input</text>
  </g>
</svg>
