<svg xmlns="http://www.w3.org/2000/svg" width="561" height="185" viewBox="0 0 561 185" role="img">
  <title>The signature of the kernel lik_opt: the output y, and the inputs mu and s</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#424a53"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="560" height="184" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g transform="translate(185.0,41.5)">
    <rect x="0.0" y="0.0" width="190.8" height="80.0" rx="8" fill="#fff0f7" stroke="#bf3989" stroke-width="1.6"/>
    <rect x="10.0" y="7.0" width="49.3" height="17.0" rx="8.5" fill="#bf3989" stroke="#bf3989" stroke-width="1"/>
    <text x="34.6" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">kernel</text>
    <text x="67.3" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">lik_opt</text>
    <text x="-11.0" y="35.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="bold" fill="#1f2328" text-anchor="end">y</text>
    <text x="178.8" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">mu</text>
    <text x="178.8" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">s</text>
    <text x="80.5" y="56.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" font-style="italic">a draw is an array</text>
    <circle cx="0.0" cy="41.0" r="4.5" fill="#bf3989" stroke="#bf3989" stroke-width="1.6"/>
    <circle cx="190.8" cy="41.0" r="4.5" fill="#bf3989" stroke="#bf3989" stroke-width="1.6"/>
    <circle cx="190.8" cy="63.0" r="4.5" fill="#ffffff" stroke="#bf3989" stroke-width="1.6"/>
    <text x="-6.0" y="-12.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#59636e" text-anchor="end" font-style="italic">outputs leave on the left</text>
    <text x="196.8" y="-12.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#59636e" text-anchor="start" font-style="italic">inputs enter on the right</text>
    <text x="95.4" y="104.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">lik_opt(y | mu, s): its draw y is an array offered under the name y;</text>
    <text x="95.4" y="122.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">it takes mu, and s is optional</text>
  </g>
