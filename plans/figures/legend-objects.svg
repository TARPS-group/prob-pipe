    <text x="140.0" y="453.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">sigma</text>
    <circle cx="152.0" cy="427.0" r="4.5" fill="#bf3989" stroke="#bf3989" stroke-width="1.6"/>
