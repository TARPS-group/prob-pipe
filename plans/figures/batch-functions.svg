<svg xmlns="http://www.w3.org/2000/svg" width="543" height="214" viewBox="0 0 543 214" role="img">
  <title>A batch of functions: its inputs and its outputs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#424a53"/>
    </marker>
    <marker id="arrow-fault" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="542" height="213" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g transform="translate(18.0,28.0)">
    <rect x="52.0" y="0.0" width="117.7" height="80.0" rx="8" fill="#eefbf1" stroke="#1a7f37" stroke-width="1.6"/>
    <rect x="62.0" y="7.0" width="61.0" height="17.0" rx="8.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1"/>
    <text x="92.5" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">function</text>
    <text x="131.0" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">f_j</text>
    <text x="64.0" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">y</text>
    <text x="64.0" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">z</text>
    <text x="157.8" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">x</text>
    <circle cx="52.0" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <circle cx="52.0" cy="63.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <circle cx="169.8" cy="41.0" r="4.5" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.6"/>
    <text x="110.9" y="128.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">one element: f_j maps x to {y, z}</text>
    <text x="110.9" y="146.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">and offers y and z</text>
    <rect x="337.1" y="-10.0" width="144.3" height="102.0" rx="8" fill="#fff8d6" stroke="#9a6700" stroke-width="1.2"/>
    <rect x="332.1" y="-5.0" width="144.3" height="102.0" rx="8" fill="#fff8d6" stroke="#9a6700" stroke-width="1.2"/>
    <rect x="327.1" y="0.0" width="144.3" height="102.0" rx="8" fill="#fff8d6" stroke="#9a6700" stroke-width="1.6"/>
    <rect x="337.1" y="7.0" width="43.4" height="17.0" rx="8.5" fill="#9a6700" stroke="#9a6700" stroke-width="1"/>
    <text x="358.8" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">batch</text>
    <text x="388.5" y="20.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start">fs</text>
    <text x="339.1" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">y</text>
    <text x="339.1" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start">z</text>
    <text x="459.5" y="45.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="end">x</text>
    <text x="399.3" y="45.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" font-style="italic">elements:</text>
    <text x="399.3" y="67.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" font-style="italic">functions</text>
    <text x="339.1" y="92.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#59636e" text-anchor="start">levels: j</text>
    <circle cx="327.1" cy="41.0" r="4.5" fill="#9a6700" stroke="#9a6700" stroke-width="1.6"/>
    <circle cx="327.1" cy="63.0" r="4.5" fill="#9a6700" stroke="#9a6700" stroke-width="1.6"/>
    <circle cx="471.5" cy="41.0" r="4.5" fill="#9a6700" stroke="#9a6700" stroke-width="1.6"/>
    <text x="399.3" y="128.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">the batch: input x, bound once</text>
    <text x="399.3" y="146.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">for every element; outputs y, z,</text>
    <text x="399.3" y="164.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle">each a batch of functions</text>
  </g>
