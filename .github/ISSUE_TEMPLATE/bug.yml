name: Bug report
description: Something isn't working as expected
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A minimal reproducer is the single
        most useful thing you can include.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet that triggers the bug.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (include the traceback if any)
      render: shell
    validations:
      required: true

  - type: dropdown
    id: silent
    attributes:
      label: Did ProbPipe give a wrong result without an error or warning?
      description: |
        A wrong result is a wrong value, draw, density, or probability, or a
        provenance record that misstates how a result was computed.
      options:
        - "Yes: the result is wrong, and no error or warning was raised"
        - "No: ProbPipe raised an error, crashed, or hung"
        - "No: the result is correct but slow, approximate, or reported with a misleading message"
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did an earlier version work?
      description: If it did, name the version under Additional context.
      options:
        - "Yes: an earlier version gave the right result"
        - "No: earlier versions fail too"
        - Not tried
    validations:
      required: true

  - type: dropdown
    id: workaround
    attributes:
      label: Is there a workaround?
      description: |
        A workaround is another documented call that gives the result. If there
        is one, describe it under Additional context.
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: input
    id: probpipe-version
    attributes:
      label: ProbPipe version
      description: |
        Output of `pip show probpipe | grep -E '^Version'`, or commit SHA
        if installed from source.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true

  - type: input
    id: jax-version
    attributes:
      label: JAX version
      description: |
        Output of `python -c "import jax; print(jax.__version__)"`. Leave blank
        if the bug is unrelated to JAX.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Anything else (e.g., OS / platform, related issues, workarounds you've tried).
    validations:
      required: false
